<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../estilos/style.css">
    <link rel="icon" href="../img/favicon.jpg" type="FAVICON">
    <title>Contacto</title>
</head>
<body>
    <header>
        <h1>Todo Reseñas</h1>
        <div class ="menu">
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="../Pages/Reseña_gral.html">Mas reseñas</a></li>
                <li><a href="../Pages/contacto.html">Contacto</a></li>
            </ul>
        </div>
    </header>

    <main>
        <div class="seccion contacto-seccion">
            <h2>Ideas para próximas reseñas</h2>
            <p>Comparte tu nombre, tu correo y una sugerencia para el sitio.</p>
            <form class="formulario-contacto" action="#" method="post">
                <div class="campo-formulario">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" autocomplete="name" required>
                </div>
                <div class="campo-formulario">
                    <label for="email">Mail</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </div>
                <div class="campo-formulario">
                    <label for="comentario">Comentario o idea</label>
                    <textarea id="comentario" name="comentario" rows="6" required></textarea>
                </div>
                <button type="submit">Enviar sugerencia</button>
            </form>
        </div>
    </main>

    <footer>
        <div class="menu">
            <p>2024 Reseñas Damy. Todos los derechos reservados.</p>
        </div>
    </footer>
</body>
</html>
